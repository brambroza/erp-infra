# deploy: ./deploy-stack.sh  (บน vm-service-1 เท่านั้น)
version: "3.8"

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }
x-place: &place
  constraints: [node.labels.role == app]

services:
  # ---------- erpapp (go-crmapp24) ----------
  erpapp:
    image: nohservdoc/go-crmapp24:${ERPAPP_TAG}
    ports:
      - { target: 80, published: 8284, mode: ingress }
    healthcheck:
      # image ใช้ nginx:stable (Debian) ไม่มี wget/curl → ลอง wget, curl แล้วค่อยใช้ /dev/tcp ของ bash
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || curl -fs http://127.0.0.1/ >/dev/null 2>&1 || bash -c 'exec 3<>/dev/tcp/127.0.0.1/80 && printf \"GET / HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging
    deploy:
      mode: global                       # เครื่องละ 1 ตัว (เครื่องล่มไม่ย้ายมาซ้อน)
      placement: *place
      update_config: { parallelism: 1, delay: 10s, order: start-first, failure_action: rollback, monitor: 30s }
      rollback_config: { parallelism: 1, order: start-first }
      resources:
        limits: { cpus: "1.00", memory: 2560M }

  # ---------- erpapi (go-crmapi24) ----------
  erpapi:
    image: nohservdoc/go-crmapi24:${ERPAPI_TAG}
    env_file: ./erpapi.env
    ports:
      - { target: 6600, published: 6334, mode: ingress }   # REST: กระจายผ่าน mesh
      - { target: 6600, published: 6344, mode: host }      # SignalR hubs: sticky จาก Nginx
    volumes:
      - erp-files:/app/wwwroot           # เดิม: -v /mnt/docker-data/binds/VolumsAPI:/app/wwwroot
    # image aspnet (Debian) ไม่มี curl/wget → ใช้ bash /dev/tcp ยิง GET / แล้วดูว่าได้คำตอบ HTTP กลับมา (status ใดก็ได้)
    # ingress จะส่ง request ให้ task นี้ก็ต่อเมื่อ healthy → ไม่มี 000 ช่วงที่ .NET กำลัง start
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6600 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '^HTTP/'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 40s
    logging: *logging
    deploy:
      # ยังรันได้แค่ 1 ตัว: SignalR ไม่มี Redis backplane (แจ้งเตือนไม่ข้ามตัว) และ background service รันซ้ำทุกตัว
      # เครื่องล่ม → Swarm ย้ายไปอีกเครื่องเอง (หยุดราว 30–60 วินาที) · แก้โค้ดแล้วค่อยตั้ง ERPAPI_REPLICAS=2
      mode: replicated
      replicas: ${ERPAPI_REPLICAS:-1}
      placement:
        constraints: [node.labels.role == app]
        max_replicas_per_node: 1         # host port ซ้อนกันไม่ได้ → เครื่องละไม่เกิน 1 ตัว
      update_config: { parallelism: 1, delay: 20s, order: stop-first, failure_action: rollback, monitor: 30s }
      rollback_config: { parallelism: 1, order: stop-first }
      resources:
        limits: { cpus: "2.00", memory: 1536M }
        reservations: { memory: 256M }

  # ---------- chat-api (go-chat-api) ----------
  chat-api:
    image: nohservdoc/go-chat-api:${CHATAPI_TAG}
    env_file: ./chat-api.env
    ports:
      - { target: 3000, published: 6335, mode: host }      # sticky จาก Nginx ถึง container จริง
    logging: *logging
    deploy:
      # ยังรันได้แค่ 1 ตัว: cron 3 job ใน app.js รันซ้ำทุกตัว และ dedupe LINE อยู่ใน memory
      # (Socket.IO ข้ามตัวได้แล้วผ่าน Redis adapter) · แก้โค้ดแล้วค่อยตั้ง CHATAPI_REPLICAS=2
      mode: replicated
      replicas: ${CHATAPI_REPLICAS:-1}
      placement:
        constraints: [node.labels.role == app]
        max_replicas_per_node: 1
      update_config: { parallelism: 1, delay: 20s, order: stop-first, failure_action: rollback, monitor: 30s }
      rollback_config: { parallelism: 1, order: stop-first }
      resources:
        limits: { cpus: "1.00", memory: 768M }

  # ---------- ticker (go-ticker-job) ----------
  ticker:
    image: nohservdoc/go-ticker-job:${TICKER_TAG}
    env_file: ./ticker.env
    logging: *logging
    deploy:
      replicas: ${TICKER_REPLICAS}       # 1 เสมอ (0 ระหว่างย้ายระบบ) ห้ามเกิน 1 ไม่อย่างนั้น job รันซ้ำ
      placement: *place
      update_config: { parallelism: 1, order: stop-first, failure_action: rollback }
      rollback_config: { parallelism: 1, order: stop-first }
      restart_policy: { condition: any, delay: 10s }
      resources:
        limits: { cpus: "0.50", memory: 512M }

volumes:
  erp-files:                             # /app/wwwroot ของ erpapi เก็บบน data VM (NFS)
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${DATA_IP},rw,nfsvers=4,hard,timeo=600"
      device: ":/srv/nfs/erp-files"

# erp-infra: เฉพาะ Swarm manager (erp-app-01) — ติดตั้งโดย scripts/50-zabbix.sh (ห้ามแก้บนเครื่อง)
UserParameter=erp.swarm.discovery,sudo -n /usr/local/bin/erp-zbx.sh swarm-discovery
UserParameter=erp.swarm.missing[*],sudo -n /usr/local/bin/erp-zbx.sh swarm-missing "$1"

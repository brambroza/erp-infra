<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" width="960" height="520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ERP infra: ผู้ใช้ → Router → VIP (gw-1 / gw-2) → Swarm vm-service-1 / vm-service-2 → vm-data-4, vm-deploy deploy">
  <title>ERP infra diagram</title>
  <style>
:root, svg {
  --bg:#f2f4f6; --card:#ffffff; --fg:#15212c; --muted:#5b6976; --line:#c9d2db;
  --blue:#1f5fbf; --blue-soft:#e3ecfa; --green:#0d7a5c; --amber:#9a5b00;
}
@media (prefers-color-scheme: dark) {
  :root, svg {
    --bg:#0d1117; --card:#161b22; --fg:#e2e8ee; --muted:#95a3b0; --line:#30363d;
    --blue:#78a9f2; --blue-soft:#1a2a40; --green:#4fc9a1; --amber:#e8b25a;
  }
}
.bg   { fill: var(--bg); }
.box  { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
.box.gw   { stroke: var(--blue);  stroke-width: 2; }
.box.app  { stroke: var(--green); stroke-width: 2; }
.box.data { stroke: var(--amber); stroke-width: 2; }
.zone { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 5 5; }
.vip  { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.5; }
text  { font-family: "Noto Sans Thai", "Leelawadee UI", "Sukhumvit Set", Tahoma, "Segoe UI", sans-serif; }
.t1, .lbl, .tv { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Thai", monospace; }
.t1  { fill: var(--muted); font-size: 11px; }
.t2  { fill: var(--fg); font-size: 14px; font-weight: 600; }
.t3  { fill: var(--fg); font-size: 12px; }
.tv  { fill: var(--blue); font-size: 12px; font-weight: 500; }
.lbl { fill: var(--muted); font-size: 10.5px; }
.ar  { stroke: var(--muted); stroke-width: 1.6; fill: none; }
.ar.b { stroke: var(--blue); }
.ar.g { stroke: var(--green); }
.dash { stroke: var(--blue); stroke-width: 1.4; stroke-dasharray: 4 4; fill: none; }
.head { fill: var(--muted); }
.head.b { fill: var(--blue); }
.head.g { fill: var(--green); }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="520" rx="12"/>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head b" d="M0 0L10 5L0 10z"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head g" d="M0 0L10 5L0 10z"/></marker>
    <marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="box" x="16" y="196" width="112" height="58" rx="6"/>
  <text class="t2" x="72" y="222" text-anchor="middle">ผู้ใช้</text>
  <text class="t1" x="72" y="241" text-anchor="middle">HTTPS :443</text>

  <rect class="box" x="156" y="190" width="122" height="70" rx="6"/>
  <text class="t2" x="217" y="216" text-anchor="middle">Router</text>
  <text class="t3" x="217" y="234" text-anchor="middle">port forward</text>
  <text class="t1" x="217" y="250" text-anchor="middle">443 → VIP</text>

  <rect class="zone" x="304" y="80" width="190" height="300" rx="10"/>
  <text class="t1" x="316" y="98">GATEWAY</text>
  <rect class="vip" x="336" y="108" width="126" height="26" rx="13"/>
  <text class="tv" x="399" y="125" text-anchor="middle">VIP (IP กลาง)</text>
  <rect class="box gw" x="318" y="148" width="162" height="82" rx="6"/>
  <text class="t1" x="330" y="167">gw-1 · MASTER</text>
  <text class="t2" x="330" y="190">ตัวหลัก</text>
  <text class="t3" x="330" y="210">Nginx + keepalived</text>
  <rect class="box gw" x="318" y="282" width="162" height="82" rx="6"/>
  <text class="t1" x="330" y="301">gw-2 · BACKUP</text>
  <text class="t2" x="330" y="324">ตัวสำรอง</text>
  <text class="t3" x="330" y="344">Nginx + keepalived</text>
  <path class="dash" d="M399 230V282"/>
  <text class="lbl" x="407" y="260">เช็กกันทุก 1 วิ</text>

  <rect class="zone" x="528" y="24" width="232" height="400" rx="10"/>
  <text class="t1" x="540" y="42">SWARM CLUSTER</text>
  <rect class="box app" x="542" y="54" width="204" height="168" rx="6"/>
  <text class="t1" x="554" y="73">vm-service-1 · manager</text>
  <text class="t3" x="554" y="98">erpapp ×1 · :8284</text>
  <text class="t3" x="554" y="118">erpapi ×1 · :6334 / :6344</text>
  <text class="t3" x="554" y="138">chat-api ×1 · :6335</text>
  <text class="t3" x="554" y="158">ticker ×1 (ตัวเดียวทั้ง cluster)</text>
  <text class="t1" x="554" y="200">RAM 4.3 GB · disk 4.6 GB</text>
  <rect class="box app" x="542" y="242" width="204" height="168" rx="6"/>
  <text class="t1" x="554" y="261">vm-service-2 · worker</text>
  <text class="t3" x="554" y="286">erpapp ×1 · :8284</text>
  <text class="t3" x="554" y="306">erpapi ×1 · :6334 / :6344</text>
  <text class="t3" x="554" y="326">chat-api ×1 · :6335</text>
  <text class="t3" x="554" y="346">ticker สำรอง (ตัวหลักล่มใช้ตัวนี้)</text>
  <text class="t1" x="554" y="388">RAM 4.3 GB · disk 4.6 GB</text>

  <rect class="box data" x="794" y="116" width="150" height="214" rx="6"/>
  <text class="t1" x="806" y="135">vm-data-4</text>
  <text class="t2" x="806" y="162">SQL Server</text>
  <text class="t2" x="806" y="186">Redis</text>
  <text class="t2" x="806" y="210">RabbitMQ</text>
  <text class="t2" x="806" y="234">Data API</text>
  <text class="t1" x="806" y="252">ไฟล์ของ erpapi (NFS)</text>
  <text class="t1" x="806" y="296">RAM 1.3 GB</text>
  <text class="t1" x="806" y="312">disk 37.9 GB</text>

  <rect class="box" x="304" y="440" width="190" height="64" rx="6"/>
  <text class="t1" x="316" y="459">vm-deploy · :8110</text>
  <text class="t2" x="316" y="482">build → deploy</text>
  <text class="t1" x="316" y="497">RAM 3.0 GB · disk 1.9 GB</text>

  <path class="ar b" d="M128 225H152" marker-end="url(#mb)"/>
  <path class="ar b" d="M278 225H300" marker-end="url(#mb)"/>
  <path class="ar g" d="M494 205L538 140" marker-end="url(#mg)"/>
  <path class="ar g" d="M494 255L538 322" marker-end="url(#mg)"/>
  <text class="lbl" x="497" y="236">แบ่งงาน</text>
  <path class="ar" d="M746 140L790 200" marker-end="url(#mm)"/>
  <path class="ar" d="M746 326L790 268" marker-end="url(#mm)"/>
  <path class="ar" d="M494 472H645V428" marker-end="url(#mm)"/>
  <text class="lbl" x="512" y="465">ssh deploy → vm-service-1</text>
</svg>

server {
    listen 443 ssl http2;
    server_name api.nisolution.co.th;
    include /etc/nginx/infra/ssl.conf;
    access_log /var/log/nginx/api.access.log main_ext;
    error_log  /var/log/nginx/api.error.log warn;
    client_max_body_size 120M;

    # ---------- erpapi: REST ----------
    location / {
        proxy_pass http://erpapi;
        include /etc/nginx/infra/proxy.conf;
        proxy_read_timeout 120s;
    }

    # ---------- erpapi: SignalR hubs (sticky + WebSocket) ----------
    location ~ ^/(notificationhub|tickettaskreplyhub|sessionhub)(/|$) {
        proxy_pass http://erpapi_hubs;
        include /etc/nginx/infra/ws.conf;
        add_header Access-Control-Allow-Origin "https://erp.nisolution.co.th";
        add_header Access-Control-Allow-Credentials "true";
    }

    location ~ ^/(ticketcommenthub|chathub)(/|$) {
        proxy_pass http://erpapi_hubs;
        include /etc/nginx/infra/ws.conf;
    }

    # ---------- JWT validate (เรียกภายในโดย auth_request) ----------
    location = /validate-token {
        internal;
        proxy_pass http://erpapi/Account/validate;
        include /etc/nginx/infra/proxy.conf;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # ---------- chat-api ----------
    location /chat-api/ {
        auth_request /validate-token;
        proxy_pass http://chatapi/;            # ตัด /chat-api/ ออกเหมือนเดิม
        include /etc/nginx/infra/ws.conf;
    }

    location /chat-liff-app/ {
        proxy_pass http://chatapi/;
        include /etc/nginx/infra/ws.conf;
    }

    location /socketionode/ {
        proxy_pass http://chatapi;             # ส่ง path เต็มเหมือนเดิม
        include /etc/nginx/infra/ws.conf;
    }

    # LINE webhook
    location /api/line/webhook/ {
        proxy_pass http://chatapi/api/line/webhook/;
        include /etc/nginx/infra/proxy.conf;
    }

    location ~ ^/chat-api/line/webhook/(.*)$ {
        proxy_pass http://chatapi/api/line/webhook/$1$is_args$args;
        include /etc/nginx/infra/proxy.conf;
    }
}

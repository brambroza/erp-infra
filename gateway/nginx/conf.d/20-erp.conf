server {
    listen 443 ssl http2;
    server_name erp.nisolution.co.th;
    include /etc/nginx/infra/ssl.conf;
    access_log /var/log/nginx/erp.access.log main_ext;

    location ~* \.(js|css|woff2?|eot|ttf|otf|svg|jpg|jpeg|png|gif|ico|webp)$ {
        proxy_pass http://erpapp;
        include /etc/nginx/infra/proxy.conf;
        # ไม่ใส่ always: ไม่ให้ 404 ช่วง rolling deploy ถูก cache ไว้ 1 ปี
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://erpapp;
        include /etc/nginx/infra/proxy.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;
    }
}

# server_tokens off ตั้งใน /etc/nginx/nginx.conf โดย 10-gateway.sh (ประกาศซ้ำใน conf.d แล้ว nginx -t ล้ม)
client_max_body_size 20m;              # api ตั้งเอง 120M

log_format main_ext '$remote_addr - [$time_local] "$host" "$request" $status $body_bytes_sent '
                    'rt=$request_time ua="$upstream_addr" urt=$upstream_response_time rid=$request_id';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
